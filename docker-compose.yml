services:
  db:
    image: mysql:8.0
    container_name: dhwani-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: portfolio_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/portfolio_db.sql:/docker-entrypoint-initdb.d/portfolio_db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dhwani-app
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: portfolio_db
      DB_USER: root
      DB_PASSWORD: rootpass
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
